<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>子龙传：长坂孤骑 · 街机像素版 V9</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f0d;color:#eee;font-family:"Microsoft YaHei",system-ui,sans-serif}
body{display:grid;place-items:center}
#frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#111;border:4px solid #2b2b22;box-sizing:border-box;box-shadow:0 18px 70px #000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#26301e}
#keys{position:fixed;left:12px;bottom:9px;font-size:11px;color:#eee5caaa;text-shadow:1px 1px #000;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="frame"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="keys">WASD移动｜J/左键连枪｜K/右键破阵突刺｜Shift/L冲阵｜Q龙胆七探｜E切武器｜X互动｜I装备｜F2判定框｜F全屏｜R重开本关</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('game'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const RENDER_SCALE=2;g.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
const W=640,H=360,LANE_TOP=170,LANE_BOTTOM=320;
const keys={},pressed={};
const mouse={x:W/2,y:H/2,left:false,right:false};
let mode='title',stageIndex=0,time=0,stageTime=0,camX=0,shake=0,flash=0,hitStop=0,slowMo=0,debugHit=false;
let enemies=[],projectiles=[],civilians=[],slashes=[],floaters=[],afterimages=[],pickups=[];
let score=0,merit=0,totalKills=0,totalRescued=0,combo=0,comboTimer=0,maxCombo=0,stageBanner=0,clearTimer=0,arena=null,encounterIndex=0;
let stageTrack={startKills:0,startRescued:0,maxCombo:0,breaks:0,rewarded:false};
let upgradeChoices=[],selectedUpgrade=-1;
let lootNotice=null,fieldEvent=null;
const gear={weapon:'龙胆亮银枪',armor:'白袍银甲',horse:'素鞍',treasure:'—'};
const gearOwned={stirrups:false,mirror:false,qinggang:false,tiger:false};
const skillLevels={rider:0,spear:0,dragon:0};
const skillLearned={rider:[],spear:[],dragon:[]};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sign=v=>v<0?-1:1;
const rectsOverlap=(a,b)=>a.x<a.x+b.w&&false;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function txt(s,x,y,size=10,col='#f2ead6',align='left'){g.fillStyle=col;g.font=`bold ${size}px monospace`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,Math.round(x),Math.round(y))}
function box(x,y,w,h,bg='#161713dd',bd='#8b7a52'){px(x,y,w,h,bg);px(x,y,w,2,bd);px(x,y+h-2,w,2,bd);px(x,y,2,h,bd);px(x+w-2,y,2,h,bd)}
function overlap(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y}

const STAGES=[
 {name:'第一关 · 长坂初阵',sub:'单骑返阵',theme:'plain',worldW:1900,story:'刘备军败走，赵子龙拨马回身。曹军前锋已封住古道。',encounters:[
   {x:430,wave:['sword','sword','spear','spear','archer']},
   {x:930,wave:['sword','sword','spear','archer','elite','sword']},
   {x:1450,boss:'captain'}]},
 {name:'第二关 · 烟村救民',sub:'乱军寻踪',theme:'village',worldW:2050,story:'烟村尽毁，百姓被困。救人，也是在寻找阿斗的踪迹。',encounters:[
   {x:440,wave:['sword','sword','archer','spear'],civs:2},
   {x:980,wave:['elite','spear','spear','archer','archer','sword'],civs:3},
   {x:1570,boss:'chunyu'}]},
 {name:'第三关 · 曹营夺锋',sub:'青釭出鞘',theme:'camp',worldW:2100,story:'曹军大营横在前路。夏侯恩佩曹操宝剑青釭，正率兵搜捕。',encounters:[
   {x:430,wave:['spear','spear','archer','archer','elite']},
   {x:1010,wave:['elite','elite','sword','spear','archer','sword']},
   {x:1600,boss:'xiahou'}]},
 {name:'第四关 · 长坂突围',sub:'怀抱阿斗',theme:'final',worldW:2250,story:'阿斗已在怀中。曹军名将张郃亲自堵截，最后一段路只能杀出去。',encounters:[
   {x:420,wave:['sword','sword','spear','spear','archer','elite']},
   {x:970,wave:['elite','elite','spear','archer','archer','sword','sword']},
   {x:1540,wave:['elite','spear','spear','archer','elite','sword']},
   {x:1880,boss:'zhanghe'}]}
];

const P={x:120,y:260,vx:0,vy:0,face:1,hp:180,maxhp:180,stam:100,dragon:0,inv:0,attack:null,attackQueued:false,heavyCharge:0,dash:0,dashCd:0,dashHits:new Set(),ult:null,anim:0,weapon:'spear',qinggang:false,baby:false,
 dmgMul:1,speedMul:1,dragonMul:1,maxStam:100,stamRegen:28,armor:0,dashCost:26,dashDX:1,dashDY:0,dashDmgMul:1,dashCdMul:1,dashSpeedMul:1,dashHitStam:0,dashHitDragon:0,dashBossBreak:false,spearReachMul:1,basicDmgMul:1,comboGrace:0,thirdDragon:0,thirdBreak:false,dragonRegen:0,ultDmgMul:1,ultRefund:0,ultCost:100,ultPostInv:.45};

function resetRun(){
 score=0;merit=0;totalKills=0;totalRescued=0;combo=0;maxCombo=0;lootNotice=null;
 Object.assign(gear,{weapon:'龙胆亮银枪',armor:'白袍银甲',horse:'素鞍',treasure:'—'});
 Object.assign(gearOwned,{stirrups:false,mirror:false,qinggang:false,tiger:false});
 Object.assign(skillLevels,{rider:0,spear:0,dragon:0});skillLearned.rider=[];skillLearned.spear=[];skillLearned.dragon=[];
 Object.assign(P,{hp:180,maxhp:180,stam:100,dragon:0,dmgMul:1,speedMul:1,dragonMul:1,maxStam:100,stamRegen:28,armor:0,dashCost:26,dashDX:1,dashDY:0,dashDmgMul:1,dashCdMul:1,dashSpeedMul:1,dashHitStam:0,dashHitDragon:0,dashBossBreak:false,spearReachMul:1,basicDmgMul:1,comboGrace:0,thirdDragon:0,thirdBreak:false,dragonRegen:0,ultDmgMul:1,ultRefund:0,ultCost:100,ultPostInv:.45,qinggang:false,baby:false,weapon:'spear'});startStage(0)
}
function startStage(i){stageIndex=i;mode='play';time=0;stageTime=0;camX=0;shake=0;flash=0;hitStop=0;slowMo=0;enemies=[];projectiles=[];civilians=[];slashes=[];floaters=[];afterimages=[];pickups=[];arena=null;encounterIndex=0;clearTimer=0;stageBanner=2.8;selectedUpgrade=-1;stageTrack={startKills:totalKills,startRescued:totalRescued,maxCombo:0,breaks:0,rewarded:false};fieldEvent=makeStageEvent(i);
 Object.assign(P,{x:115,y:260,vx:0,vy:0,face:1,stam:P.maxStam,dragon:Math.min(P.dragon,60),inv:1.0,attack:null,attackQueued:false,heavyCharge:0,dash:0,dashCd:0,ult:null,anim:0});
 P.hp=Math.min(P.maxhp,P.hp+Math.round(P.maxhp*.28)); if(i===3)P.baby=true;
}
function restartStage(){const keep={maxhp:P.maxhp,dmgMul:P.dmgMul,speedMul:P.speedMul,dragonMul:P.dragonMul,maxStam:P.maxStam,stamRegen:P.stamRegen,armor:P.armor,dashCost:P.dashCost,dashDmgMul:P.dashDmgMul,dashCdMul:P.dashCdMul,dashSpeedMul:P.dashSpeedMul,dashHitStam:P.dashHitStam,dashHitDragon:P.dashHitDragon,dashBossBreak:P.dashBossBreak,spearReachMul:P.spearReachMul,basicDmgMul:P.basicDmgMul,comboGrace:P.comboGrace,thirdDragon:P.thirdDragon,thirdBreak:P.thirdBreak,dragonRegen:P.dragonRegen,ultDmgMul:P.ultDmgMul,ultRefund:P.ultRefund,ultCost:P.ultCost,ultPostInv:P.ultPostInv,qinggang:P.qinggang,weapon:P.weapon};P.hp=keep.maxhp;Object.assign(P,keep);startStage(stageIndex)}

function bind(){
 addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;
   if(k==='f2')debugHit=!debugHit;
   if(k==='f'){const el=document.getElementById('frame');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.();}
   if(k==='i'&&(mode==='play'||mode==='gear')){mode=mode==='gear'?'play':'gear';}
   if(k==='r'&&mode!=='title')restartStage();
   if((e.key==='Enter'||e.key===' ')&&mode==='title')resetRun();
   if(mode==='upgrade'&&['1','2','3'].includes(k))chooseUpgrade(+k-1);
   if(mode==='upgrade'&&k==='4')buySupply();
   if(mode==='upgrade'&&k==='5')rerollUpgrade();
   if(mode==='stageclear'&&(e.key==='Enter'||e.key===' '))openUpgrade();
   if(mode==='dead'&&(e.key==='Enter'||e.key===' '))restartStage();
   if(mode==='win'&&(e.key==='Enter'||e.key===' ')){mode='title'};
   if(k==='e'&&P.qinggang&&(mode==='play'||mode==='gear')){P.weapon=P.weapon==='spear'?'sword':'spear';gear.weapon=P.weapon==='spear'?'龙胆亮银枪':'青釭剑';floater(P.x,P.y-56,gear.weapon,'#fff0b0')}
 });
 addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
 cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
 cv.addEventListener('mousedown',e=>{if(mode==='title'){resetRun();return} if(e.button===0){mouse.left=true;attackInput()} if(e.button===2){mouse.right=true;P.heavyCharge=0}});
 cv.addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2){mouse.right=false;if(mode==='play')releaseHeavy()}});cv.oncontextmenu=e=>e.preventDefault();
}
bind();

function floater(x,y,text,col='#f5e3b6',life=1){floaters.push({x,y,text,col,life,max:life})}
function comboDmgMul(){return combo>=28?1.22:combo>=16?1.13:combo>=8?1.06:1}
function comboSpeedMul(){return combo>=28?1.08:combo>=16?1.05:1}
function comboDragonMul(){return combo>=28?1.28:combo>=16?1.14:1}
function comboTitle(){return combo>=28?'一骑当千':combo>=16?'龙胆无双':combo>=8?'破阵之势':''}
function spawnPickup(x,y,forced=null){
 const r=Math.random(),type=forced||(r<.42?'food':r<.72?'dragon':'merit');
 pickups.push({x,y,type,life:9,anim:rnd(0,6)});
}
function applyRandomAffix(){
 const pool=[
  {n:'勇',d:'攻击 +4%',a:()=>P.dmgMul*=1.04},
  {n:'疾',d:'移动 +3%',a:()=>P.speedMul*=1.03},
  {n:'守',d:'减伤 +3%',a:()=>P.armor=clamp(P.armor+.03,0,.42)},
  {n:'龙',d:'龙胆获取 +8%',a:()=>P.dragonMul*=1.08},
  {n:'骑',d:'体力 +10',a:()=>{P.maxStam+=10;P.stam=Math.min(P.maxStam,P.stam+10)}}
 ];
 const a=pool[(Math.random()*pool.length)|0];a.a();return a;
}
function slash(x,y,w,h,face=1,col='#f4efd9',life=.12){slashes.push({x,y,w,h,face,col,life,max:life})}
function bodyRect(o){return{x:o.x-12,y:o.y-36,w:24,h:34}}
function screenX(wx){return wx-camX}

function spawnEnemy(type,x,y,bossKind=null){
 let hp=70,speed=45,damage=12,w=18,h=36,boss=false,name='曹军';
 if(type==='spear'){hp=86;speed=40;damage=14;name='曹军枪兵'}
 if(type==='archer'){hp=58;speed=34;damage=12;name='曹军弓手'}
 if(type==='elite'){hp=150;speed=48;damage=18;name='曹军精锐'}
 if(type==='boss'){boss=true;w=31;h=50;
   const map={captain:['曹强',900,52,14],chunyu:['淳于导',1250,57,16],xiahou:['夏侯恩',1650,62,18],zhanghe:['张郃',2250,68,20]};
   const m=map[bossKind];name=m[0];hp=m[1];speed=m[2];damage=m[3];
 }
 enemies.push({x,y,vx:0,vy:0,type,boss,bossKind,name,hp,maxhp:hp,speed,damage,w,h,face:-1,stun:0,stunVisual:0,breakFlash:0,flash:0,ifr:0,attack:null,ai:0,dead:false,knockX:0,knockY:0,anim:rnd(0,10),rage:false,guard:0,hitCount:0,deathTimer:0,special1:false,special2:false});
}
function makeStageEvent(i){
 const pools=[
  [{type:'scout',name:'受伤斥候',desc:'救下斥候',x:720,y:236},{type:'cache',name:'散落军械',desc:'搜取军械',x:1180,y:286}],
  [{type:'refugee',name:'迷路百姓',desc:'护送百姓',x:760,y:288},{type:'medicine',name:'遗落药箱',desc:'取得药箱',x:1320,y:236}],
  [{type:'drum',name:'曹军战鼓',desc:'毁掉战鼓',x:760,y:245},{type:'standard',name:'中军大纛',desc:'夺取军旗',x:1320,y:287}],
  [{type:'cache',name:'败军辎重',desc:'搜索辎重',x:760,y:242},{type:'standard',name:'曹军号旗',desc:'斩断号旗',x:1370,y:284}]
 ];
 const c=pools[i][(Math.random()*pools[i].length)|0];return {...c,done:false,anim:rnd(0,6)};
}
function updateFieldEvent(dt){
 if(!fieldEvent||fieldEvent.done)return;fieldEvent.anim+=dt*4;
 if(dist(P,fieldEvent)<40&&pressed['x']){
  fieldEvent.done=true;let desc='';
  if(fieldEvent.type==='scout'){merit+=55;P.dragon=clamp(P.dragon+22,0,100);desc='战功 +55 · 龙胆 +22'}
  else if(fieldEvent.type==='cache'){merit+=45;P.stam=clamp(P.stam+45,0,P.maxStam);spawnPickup(fieldEvent.x+18,fieldEvent.y,'merit');desc='战功 +45 · 恢复体力'}
  else if(fieldEvent.type==='refugee'){merit+=60;totalRescued++;P.hp=Math.min(P.maxhp,P.hp+22);desc='救人 +1 · 战功 +60'}
  else if(fieldEvent.type==='medicine'){const heal=Math.round(P.maxhp*.28);P.hp=Math.min(P.maxhp,P.hp+heal);merit+=35;desc='生命 +'+heal+' · 战功 +35'}
  else if(fieldEvent.type==='drum'){merit+=70;P.dmgMul*=1.04;desc='战功 +70 · 本轮攻击 +4%'}
  else if(fieldEvent.type==='standard'){merit+=60;P.dragonMul*=1.06;desc='战功 +60 · 龙胆获取 +6%'}
  score+=400;lootNotice={t:2.6,title:'奇遇完成：'+fieldEvent.name,desc};floater(P.x,P.y-75,'支线完成','#fff0aa',1.0);
 }
}
function drawFieldEvent(){
 if(!fieldEvent||fieldEvent.done)return;const x=screenX(fieldEvent.x),y=fieldEvent.y,b=Math.sin(fieldEvent.anim)*2;
 if(x<-40||x>W+40)return;shadow(x,y,24);
 if(fieldEvent.type==='scout'||fieldEvent.type==='refugee'){px(x-7,y-26+b,14,18,'#766a4c');px(x-5,y-38+b,10,10,'#c9a57b');px(x-7,y-43+b,14,5,'#4c3b2d')}
 else if(fieldEvent.type==='medicine'||fieldEvent.type==='cache'){px(x-13,y-20+b,26,18,'#7a5433');px(x-11,y-18+b,22,5,'#b18b53');txt(fieldEvent.type==='medicine'?'药':'军',x,y-9+b,8,'#efe1b8','center')}
 else {px(x-2,y-42+b,4,44,'#5b3925');px(x+2,y-39+b,24,16,fieldEvent.type==='drum'?'#8f3b2d':'#9d3230');txt(fieldEvent.type==='drum'?'鼓':'曹',x+14,y-31+b,8,'#f0d7ae','center')}
 txt('?',x,y-54+b,10,'#ffe49b','center');
}
function spawnWave(enc){
 const center=enc.x+150,ys=[205,245,285,315];
 if(enc.wave){enc.wave.forEach((t,i)=>spawnEnemy(t,center+70+(i%3)*65,ys[i%ys.length]+rnd(-8,8)))}
 if(enc.civs){for(let i=0;i<enc.civs;i++)civilians.push({x:center+30+i*85,y:220+(i%2)*65,saved:false,anim:rnd(0,5)})}
 if(enc.boss)spawnEnemy('boss',center+170,255,enc.boss);
 arena={left:enc.x-120,right:Math.min(STAGES[stageIndex].worldW-80,enc.x+420),enc,clearHold:0};
 floater(P.x+120,P.y-78,enc.boss?'敌将杀到！':'曹军截阵！','#ffd890',1.2)
}

function attackInput(){
 if(mode!=='play'||P.dash>0||P.ult)return;
 if(P.attack){P.attackQueued=true;return}
 startBasicAttack(1)
}
function startBasicAttack(chain){
 const sword=P.weapon==='sword';
 const defs=sword?
 [{dur:.22,a0:.055,a1:.135,near:12,reach:80,lane:44,dmg:28,knock:45},{dur:.24,a0:.07,a1:.16,near:10,reach:88,lane:46,dmg:31,knock:55},{dur:.30,a0:.09,a1:.205,near:8,reach:98,lane:50,dmg:42,knock:115}]:
 [{dur:.27,a0:.07,a1:.165,near:26,reach:142,lane:50,dmg:32,knock:50},{dur:.29,a0:.075,a1:.185,near:24,reach:151,lane:52,dmg:36,knock:62},{dur:.37,a0:.10,a1:.245,near:20,reach:162,lane:58,dmg:52,knock:145}];
 const d={...defs[chain-1]};if(!sword)d.reach=Math.round(d.reach*P.spearReachMul);
 P.attack={kind:'basic',chain,t:0,hit:false,hitSet:new Set(),...d};P.attackQueued=false;
}
function releaseHeavy(){
 if(mode!=='play'||P.dash>0||P.ult||P.attack)return;
 if(P.heavyCharge<.10){P.heavyCharge=0;return}
 const p=clamp(P.heavyCharge/1.15,0,1),sword=P.weapon==='sword';
 const tier=p>=.82?3:p>=.42?2:1;
 const tierMul=[0,1,1.38,1.82][tier];
 P.attack={kind:'heavy',chain:0,t:0,dur:.50,a0:.13,a1:.31,
   near:sword?8:20,reach:(sword?104:Math.round((158+tier*14)*P.spearReachMul))+tier*(sword?10:0),lane:58+tier*7,
   dmg:((sword?62:76)+p*58)*tierMul,knock:170+tier*65,
   hit:false,hitSet:new Set(),guardBreak:true,charge:p,tier,lunge:330+tier*62};
 floater(P.x,P.y-70,tier===3?'满蓄 · 破阵！':tier===2?'二段蓄力':'破阵突刺',tier===3?'#fff0a8':'#e9d29a',.6);
 P.heavyCharge=0
}
function dashInput(){
 if(mode!=='play'||P.dashCd>0||P.stam<P.dashCost||P.attack||P.ult)return;
 let dx=(keys['d']?1:0)-(keys['a']?1:0),dy=((keys['s']?1:0)-(keys['w']?1:0))*.58;
 if(dx===0)dx=P.face;if(dx!==0)P.face=dx>0?1:-1;
 const m=Math.hypot(dx,dy)||1;P.dashDX=dx/m;P.dashDY=dy/m;
 P.dash=.34;P.dashCd=.56*P.dashCdMul;P.stam-=P.dashCost;P.inv=.39;P.dashHits=new Set();P.vx=P.dashDX*290*P.dashSpeedMul;P.vy=P.dashDY*290*P.dashSpeedMul;shake=2;
}
function ultInput(){
 if(mode!=='play'||P.dragon<P.ultCost||P.ult||P.attack)return;
 P.dragon=Math.max(0,P.dragon-P.ultCost);P.attack=null;P.ult={t:0,step:0,hitSet:new Set()};P.inv=2.1;slowMo=.28;flash=.12;shake=5;floater(P.x,P.y-72,'常山赵子龙在此！','#fff1b8',1.5)
}

function attackHitbox(a){
 const near=a.near??(P.weapon==='spear'?22:10),far=a.reach;
 const x=P.face>0?P.x+near:P.x-far;
 const cy=P.y-23;
 return{x,y:cy-a.lane/2,w:Math.max(8,far-near),h:a.lane}
}
function enemyHurtRect(e){return{x:e.x-e.w*.72,y:e.y-e.h+2,w:e.w*1.44,h:e.h+8}}
function playerHurtRect(){return{x:P.x-14,y:P.y-43,w:28,h:40}}
function applyPlayerAttack(a){
 const hb=attackHitbox(a);if(debugHit)slashes.push({debug:true,x:hb.x,y:hb.y,w:hb.w,h:hb.h,life:.02,max:.02});

function openUpgrade(){
 mode='upgrade';upgradeChoices=[];
 for(const path of ['rider','spear','dragon']){
  const lv=Math.min(skillLevels[path],2),opts=SKILL_TREES[path][lv],pick=opts[(Math.random()*opts.length)|0];
  upgradeChoices.push({...pick,path,tier:lv+1});
 }
}
function chooseUpgrade(i){
 if(mode!=='upgrade'||!upgradeChoices[i])return;const u=upgradeChoices[i];
 u.apply();skillLevels[u.path]=Math.min(3,skillLevels[u.path]+1);skillLearned[u.path].push(u.name);selectedUpgrade=i;startStage(stageIndex+1)
}
function buySupply(){
 if(merit<100){lootNotice={t:1.5,title:'战功不足',desc:'补给需要 100 战功'};return}
 if(P.hp>=P.maxhp){lootNotice={t:1.5,title:'无需补给',desc:'当前生命已满'};return}

function update(dt){
time+=dt;stageBanner=Math.max(0,stageBanner-dt);flash=Math.max(0,flash-dt);shake*=Math.pow(.018,dt);comboTimer=Math.max(0,comboTimer-dt);if(comboTimer<=0)combo=0;if(lootNotice){lootNotice.t-=dt;if(lootNotice.t<=0)lootNotice=null;}
 if(mode!=='play'){for(const k in pressed)delete pressed[k];return;}
 if(hitStop>0){hitStop-=dt;return}
 const scaled=dt*(slowMo>0?slowMo:1);stageTime+=scaled;
 updatePlayer(dt);for(const e of enemies)updateEnemy(e,scaled);updateArcherAttacks(scaled);updateProjectiles(scaled);updateCivs(scaled);updatePickups(scaled);updateFieldEvent(scaled);updateStage(scaled);
 enemies=enemies.filter(e=>!e.dead||e.deathTimer>0);slashes.forEach(s=>s.life-=dt);slashes=slashes.filter(s=>s.life>0);floaters.forEach(f=>{f.life-=dt;f.y-=18*dt});floaters=floaters.filter(f=>f.life>0);afterimages.forEach(a=>a.life-=dt);afterimages=afterimages.filter(a=>a.life>0);
 // Camera dead-zone: allow real left/right footsies instead of snapping Zhao Yun back toward one screen position.
 const maxCam=Math.max(0,STAGES[stageIndex].worldW-W),sx=P.x-camX;
 const leftZone=W*.23,rightZone=W*.74;let target=camX;
 if(sx>rightZone)target=P.x-rightZone;else if(sx<leftZone)target=P.x-leftZone;
 target=clamp(target,0,maxCam);
 const camFollow=P.dash>0?2.4:4.8;camX+=(target-camX)*Math.min(1,dt*camFollow);
 for(const k in pressed)delete pressed[k];
}

 if(fieldEvent&&!fieldEvent.done&&dist(P,fieldEvent)<70){box(W/2-94,H-63,188,22,'#1b1710e8','#9c7d48');txt('X 互动：'+fieldEvent.desc,W/2,H-52,8,'#ffe6aa','center')}
 if(lootNotice){box(W/2-126,118,252,42,'#18160fef','#d2ae59');txt(lootNotice.title,W/2,131,10,'#fff0af','center');txt(lootNotice.desc,W/2,147,7,'#e1d2ad','center')}
}

 box(78,38,484,288,'#10110ff2','#9a8253');txt('赵子龙 · 装备与流派',W/2,61,19,'#f0d79a','center');
 const rows=[
  ['武器',P.weapon==='spear'?'龙胆亮银枪':'青釭剑',P.qinggang?'E 切换武器':'未获得青釭剑'],
  ['护具',gear.armor,gearOwned.mirror?'生命 +25 / 减伤 +8%':'基础护具'],
  ['马具',gear.horse,gearOwned.stirrups?'移动 +6% / 冲阵耗体 -4':'基础马具'],
  ['宝物',gear.treasure,gearOwned.tiger?'龙胆获取 +10%':'尚未获得']
 ];
 rows.forEach((r,i)=>{const y=91+i*31;box(106,y-12,428,25,'#1a1d17','#625943');txt(r[0],120,y,7,'#cbbd9d');txt(r[1],176,y-1,9,'#f3e1b7');txt(r[2],520,y+6,6,'#bfb49c','right')});
 const paths=[['骑战',skillLevels.rider,skillLearned.rider],['枪术',skillLevels.spear,skillLearned.spear],['龙胆',skillLevels.dragon,skillLearned.dragon]];
 paths.forEach((r,i)=>{const y=226+i*22;txt(`${r[0]}  ${'◆'.repeat(r[1])}${'◇'.repeat(3-r[1])}`,116,y,8,'#ffe0a0');txt(r[2].length?r[2].join(' / '):'尚未习得战技',214,y,7,'#d6c9aa')});
 txt(`攻击×${(P.dmgMul*P.basicDmgMul).toFixed(2)}  枪距×${P.spearReachMul.toFixed(2)}  大招×${P.ultDmgMul.toFixed(2)}  战功${merit}`,W/2,296,7,'#e0d2b3','center');
 txt('按 I 返回战场',W/2,314,7,'#ffe7aa','center');
}
function drawBanner(){if(stageBanner<=0)return;const a=clamp(stageBanner/.45,0,1);g.globalAlpha=a;box(120,102,400,96,'#10110deb','#86744d');txt(STAGES[stageIndex].name,W/2,128,20,'#f0d89f','center');txt(STAGES[stageIndex].sub,W/2,153,11,'#d7c49a','center');txt(STAGES[stageIndex].story,W/2,181,8,'#ddd4c0','center');g.globalAlpha=1}
function drawTitle(){
 px(0,0,W,H,'#141612');for(let y=0;y<H;y+=10)px(0,y,W,1,'#22251b');flag(84,252,'赵',false);flag(520,252,'曹',true);
 txt('子 龙 传',W/2,82,38,'#ead7a0','center');txt('长 坂 孤 骑',W/2,122,17,'#c7b487','center');txt('ARCADE PIXEL EDITION',W/2,148,8,'#91866f','center');
 const ox=P.x,oy=P.y,of=P.face;P.x=220;P.y=278;P.face=1;drawHorsePlayer(P.x,P.y,1,1);P.x=ox;P.y=oy;P.face=of;
 const fake={x:430,y:279,type:'elite',boss:false,face:-1,flash:0,anim:0,w:18,h:36};drawSoldier(fake);
 txt('四关街机流程 · 差异Boss机制 · 随机战场奇遇 · 三系流派树 · 装备词条',W/2,298,8,'#d8ceb7','center');
 txt('K按住蓄力，松开=破阵突刺；二段以上破防，满蓄强硬直',W/2,315,8,'#cdbf9f','center');txt('点击 / ENTER 开始',W/2,338,11,'#ffe09a','center')
}
function drawStageClear(){
 const o=objectiveInfo();box(118,76,404,205,'#10110eed','#8d774c');txt('STAGE CLEAR',W/2,102,24,'#f0d79a','center');txt(STAGES[stageIndex].name,W/2,132,11,'#e2d4b8','center');
 txt(`本关最高连击 ${stageTrack.maxCombo}   破势 ${stageTrack.breaks}   战功 ${merit}`,W/2,166,8,'#d8cdb7','center');txt(fieldEvent?.done?'战场奇遇：已完成':'战场奇遇：未完成',W/2,179,7,fieldEvent?.done?'#e7d68f':'#aaa08d','center');
 txt(o.ok?`挑战完成 +${o.r}战功`:'挑战未完成',W/2,188,9,o.ok?'#ffe1a0':'#aaa08d','center');
 txt(`当前得分 ${score}`,W/2,214,11,'#ffe1a0','center');txt('ENTER：战后整备',W/2,248,10,'#fff0b2','center')
}
function drawUpgrade(){
 box(40,34,560,292,'#10110eee','#8d774c');txt('战 后 整 备 · 选择流派战技',W/2,57,18,'#f0d79a','center');txt(`战功 ${merit} · 同一路线连续投入可解锁二阶、三阶战技`,W/2,81,7,'#d9c9a6','center');
 upgradeChoices.forEach((u,i)=>{const x=66+i*172,m=TREE_META[u.path],lv=skillLevels[u.path];box(x,104,156,145,'#1d2018','#716345');txt(`${i+1}  ${m.mark}·${m.name}`,x+78,122,9,'#ffe0a0','center');txt(`当前 ${'◆'.repeat(lv)}${'◇'.repeat(3-lv)}`,x+78,141,7,'#c9bb99','center');txt(`第${u.tier}阶 · ${u.name}`,x+78,166,10,'#f1e1b9','center');const parts=u.desc.match(/.{1,10}/g)||[u.desc];parts.forEach((ss,j)=>txt(ss,x+78,194+j*14,8,'#cfc5ae','center'))});
 txt('4 补给(100战功/回30%生命)     5 换一批战技(80战功)',W/2,274,7,'#cfc2a5','center');
 txt('提示：专精一路会更强；三路各点一级则更全面',W/2,301,7,'#ffe8ad','center')
}
function drawDead(){box(160,88,320,176,'#120f0eee','#794f45');txt('败 走 长 坂',W/2,126,25,'#dba89c','center');txt(`本关：${STAGES[stageIndex].name}`,W/2,164,9,'#d8c9b7','center');txt('按 ENTER / R 重试本关',W/2,214,10,'#ffe0a0','center')}
function drawWin(){box(98,60,444,244,'#100f0dee','#947d4d');txt('一 身 是 胆',W/2,98,31,'#f1d79a','center');txt('赵子龙怀抱阿斗，杀出长坂。',W/2,139,11,'#e4d6ba','center');txt(`总斩敌 ${totalKills}   救人 ${totalRescued}`,W/2,181,10,'#ddd1b8','center');txt(`最高连击 ${maxCombo}   最终得分 ${score}`,W/2,207,10,'#ffe1a0','center');txt(P.qinggang?'青釭剑已夺 · 四关全破':'四关全破',W/2,238,9,'#cdbf9f','center');txt('按 ENTER 返回标题',W/2,277,9,'#ffe7aa','center')}
function draw(){
 if(mode==='title'){drawTitle();return}
 const sx=shake?Math.round(rnd(-shake,shake)):0,sy=shake?Math.round(rnd(-shake,shake)):0;g.save();g.translate(sx,sy);drawWorld();
 drawFieldEvent();const drawables=[];for(const c of civilians)if(!c.saved)drawables.push({y:c.y,kind:'c',o:c});for(const e of enemies)drawables.push({y:e.y,kind:'e',o:e});drawables.push({y:P.y,kind:'p'});drawables.sort((a,b)=>a.y-b.y);for(const d of drawables){if(d.kind==='c')drawCiv(d.o);else if(d.kind==='e')drawSoldier(d.o);else drawPlayer()}
 for(const p of pickups)drawPickup(p);for(const p of projectiles)drawProjectile(p);for(const s of slashes)drawSlash(s);drawFloaters();g.restore();drawUI();drawBanner();
 if(flash>0){g.fillStyle=`rgba(255,247,220,${Math.min(.45,flash*3)})`;g.fillRect(0,0,W,H)}
 if(mode==='stageclear')drawStageClear();if(mode==='upgrade')drawUpgrade();if(mode==='gear')drawGear();if(mode==='dead')drawDead();if(mode==='win')drawWin();
}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
